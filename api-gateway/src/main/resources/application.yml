server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:

        # Product Service
        - id: product-service
          uri: http://localhost:8081
          predicates:
            - Path=/products/**

        # Customer Service
        - id: customer-service
          uri: http://localhost:8082
          predicates:
            - Path=/customers/**

        # Order Service
        - id: order-service
          uri: http://localhost:8083
          predicates:
            - Path=/orders/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

  endpoint:
    health:
      show-details: always